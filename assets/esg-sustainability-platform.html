<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESG & Sustainability Intelligence</title>

<style>
:root{--navy:#0A2540;--green:#00A86B;--bg:#F5F7FA;--dark:#0C1928;--card:#fff;--text:#0A2540;--muted:#64748b;--line:#e2e8f0;--red:#dc2626;--amber:#d97706;--shadow:0 1px 3px rgba(10,37,64,.08),0 4px 14px rgba(10,37,64,.05)}
[data-theme=dark]{--bg:var(--dark);--card:color-mix(in srgb,var(--dark) 90%,#fff);--text:#e8eef5;--muted:#9fb0c3;--line:rgba(255,255,255,.13);--shadow:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
[dir=rtl] body{font-family:"Segoe UI",Tahoma,Arial,sans-serif}
h2,h3,h4{margin:0}h3{font-size:15px}
.muted{color:var(--muted)}.sm{font-size:12px}.r{text-align:end}.sp{flex:1}
.side{position:fixed;inset-block:0;inset-inline-start:0;width:238px;background:var(--navy);color:#fff;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
[data-theme=dark] .side{background:color-mix(in srgb,var(--dark) 82%,#000)}
.brand{padding:16px 18px;display:flex;gap:10px;align-items:center;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1);line-height:1.2}
.logo{min-width:34px;height:34px;border-radius:9px;background:var(--green);display:grid;place-items:center;font-weight:800}
.nav{padding:10px;display:flex;flex-direction:column;gap:3px;overflow:auto}
.nav button{background:none;border:0;color:#cbd5e1;padding:10px 12px;border-radius:8px;text-align:start;cursor:pointer;font:inherit;display:flex;gap:10px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.08)}.nav button.on{background:var(--green);color:#fff;font-weight:600}
.sidefoot{padding:12px 16px;font-size:11px;color:#94a3b8}
.top{margin-inline-start:238px;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.top h1{font-size:16px;margin:0 8px 0 0}
.main{margin-inline-start:238px;padding:20px;max-width:1500px}
.burger{display:none}
select,input,textarea,button{font:inherit}
select,input[type=text],input[type=number],input[type=search],textarea,input[type=color]{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);max-width:100%}
input[type=color]{padding:2px;height:34px;width:54px}
textarea{width:100%;min-height:80px}
.btn{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--green)}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--red);border-color:var(--red)}.btn.ghost{background:none}.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-theme=dark] .btn.on{background:var(--green);border-color:var(--green)}
.ib{background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;padding:2px 5px;border-radius:6px}.ib:hover{background:var(--line);color:var(--text)}
.ph{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.ph h2{font-size:22px}.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.card>h3,.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.g{display:grid;gap:14px;margin-bottom:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kv{font-size:24px;font-weight:700;margin:2px 0}.kv small{font-size:12px;color:var(--muted);font-weight:500}
.kh{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dl{font-size:12px;font-weight:600}.dl.up{color:var(--green)}.dl.dn{color:var(--red)}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;border-radius:9px}
.cv{position:relative;height:270px}
.tw{overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
td input{width:100%;min-width:70px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.t-c,.t-l{background:rgba(0,168,107,.16);color:#059669}.t-p,.t-m{background:rgba(217,119,6,.16);color:#d97706}.t-n,.t-h{background:rgba(220,38,38,.14);color:#dc2626}.t-x{background:var(--line);color:var(--muted)}
.banner{background:rgba(0,168,107,.12);border:1px solid var(--green);border-radius:10px;padding:9px 13px;margin-bottom:14px;font-size:13px}
.warn{background:rgba(217,119,6,.12);border:1px solid var(--amber);border-radius:10px;padding:9px 13px;margin-bottom:14px;font-size:13px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c,var(--green)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring b{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:21px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;border-inline-start:4px solid var(--green)}
.item.h{border-inline-start-color:var(--red)}.item.m{border-inline-start-color:var(--amber)}
.heat{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.heat b{width:60px;font-size:12px}
.cell{width:26px;height:26px;border-radius:5px;cursor:pointer;border:0}.cell.c{background:#00A86B}.cell.p{background:#F59E0B}.cell.n{background:#EF4444}
.modal{position:fixed;inset:0;background:rgba(5,15,30,.6);display:grid;place-items:center;z-index:100;padding:14px}
.modal[hidden]{display:none}
.mbox{background:var(--card);color:var(--text);border-radius:14px;padding:20px;width:min(560px,100%);max-height:92vh;overflow:auto}
.mbox h3{margin-bottom:12px;font-size:17px}.fld{margin-bottom:10px}.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.fld input,.fld select,.fld textarea{width:100%}
.mfoot{display:flex;gap:8px;margin-top:14px}.fsec{font-weight:700;margin:12px 0 6px;color:var(--green)}
.pop{position:absolute;inset-inline-end:16px;top:54px;width:340px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;z-index:60;max-height:70vh;overflow:auto}
.pop[hidden]{display:none}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-inline-start:2px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.toast{position:fixed;bottom:18px;inset-inline-end:18px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:200;box-shadow:var(--shadow)}
body.edit [data-k]{outline:1px dashed var(--green);outline-offset:2px;cursor:text;border-radius:3px}
body.edit [data-k]:hover{background:rgba(0,168,107,.14)}
[data-k][contenteditable=true]{background:rgba(0,168,107,.2);outline:2px solid var(--green)}
#reportDoc{background:#fff;color:#0A2540;padding:34px;border-radius:12px;border:1px solid var(--line);font-size:13px}
#reportDoc h1{font-size:24px;border-bottom:3px solid var(--green);padding-bottom:8px;margin:0 0 6px}
#reportDoc h3{margin:20px 0 8px;color:#0A2540;border-bottom:1px solid #e2e8f0;padding-bottom:4px}
#reportDoc th{color:#475569;background:#f1f5f9}#reportDoc td,#reportDoc th{border-bottom:1px solid #e2e8f0}
#reportDoc .muted{color:#64748b}
.nb{page-break-inside:avoid}
@media(max-width:900px){.side{transform:translateX(-100%)}[dir=rtl] .side{transform:translateX(100%)}.side.open{transform:none!important}.top,.main{margin-inline-start:0}.burger{display:inline-block}.main{padding:12px}}
@media print{body *{visibility:hidden}#reportDoc,#reportDoc *{visibility:visible}#reportDoc{position:absolute;inset-inline-start:0;top:0;width:100%;border:0;padding:0}.side,.top{display:none}}
</style>

/* ============ calculation engine ============ */
const CONV={'MWh>kWh':1000,'GJ>kWh':277.778,'kWh>MWh':.001,'kWh>GJ':.0036,'GJ>MWh':.277778,'MWh>GJ':3.6,'t>kg':1000,'kg>t':.001,'m3>L':1000,'L>m3':.001,'m³>L':1000,'L>m³':.001};
function conv(a){if(!a.fUnit||a.unit===a.fUnit)return[1,true];const c=CONV[a.unit+'>'+a.fUnit];return c?[c,true]:[1,false]}
function actKg(a){return(num(a.qty)||0)*conv(a)[0]*(num(a.factor)||0)} // kgCO2e = activity × factor
function carbon(y){const r={s1:0,s2:0,s3:0,n:0,total:0,list:[]};D().acts.filter(a=>a.year==y).forEach(a=>{const t=actKg(a)/1000;r['s'+a.scope]+=t;r.n++;r.list.push({a,t})});r.total=r.s1+r.s2+r.s3;return r}
function val(k,y){if(k.link){const c=carbon(y);if(!c.n)return null;return{c_total:c.total,c_s1:c.s1,c_s2:c.s2,c_s3:c.s3}[k.link]??null}return num((k.v||{})[y])}
function score(k,y){if(k.scored==='n')return null;const v=val(k,y);if(v==null)return null;const t=num(k.target);
 if(t!=null){if(k.hib==='y')return t===0?100:cl(v/t*100);if(t===0)return v===0?100:cl(100-v*20);return v===0?100:cl(t/v*100)}
 const b=val(k,py(y));if(b==null||b===0)return 50;const ch=(v-b)/Math.abs(b)*100;return cl(50+(k.hib==='y'?ch:-ch)*5)}
function pillarScore(p,y){return avg(D().kpis.filter(k=>k.p===p).map(k=>score(k,y)).filter(x=>x!=null))}
function overall(y){let sw=0,sv=0;['E','S','G'].forEach(p=>{const s=pillarScore(p,y);const w=num(S.weights[p])||0;if(s!=null&&w>0){sv+=s*w;sw+=w}});return sw?sv/sw:null}
function delta(k){const a=val(k,S.year),b=val(k,py(S.year));if(a==null||b==null||b===0)return null;const ch=(a-b)/Math.abs(b)*100;return{ch,good:k.hib==='y'?ch>=0:ch<=0}}
function esrsStats(){const e=D().esrs,c=e.filter(r=>r.st==='c').length,p=e.filter(r=>r.st==='p').length,n=e.filter(r=>r.st==='n').length;return{c,p,n,t:e.length,pct:e.length?(c+.5*p)/e.length*100:null}}
function benchRows(){return D().bench.map(b=>{const k=b.kpi?D().kpis.find(x=>x.id===b.kpi):null;const ours=k?val(k,S.year):num(b.ours);const peer=num(b.peer);let st='equal';if(ours!=null&&peer!=null&&ours!==peer)st=(b.hib==='y'?ours>peer:ours<peer)?'better':'lags';return{b,ours,peer,st}})}
function benchPos(){const r=benchRows().filter(x=>x.ours!=null&&x.peer!=null);return r.length?r.filter(x=>x.st!=='lags').length/r.length*100:null}
function alerts(){const out=[],y=S.year;D().kpis.forEach(k=>{const v=val(k,y);if(v==null)return;const mx=num(k.amax),mn=num(k.amin);if(mx!=null&&v>mx)out.push({l:'h',m:f('al_above',{n:k.name,v:fmt(v,2),x:fmt(mx,2)})});if(mn!=null&&v<mn)out.push({l:'h',m:f('al_below',{n:k.name,v:fmt(v,2),x:fmt(mn,2)})});if(k.link==='c_total'||k.link==='c_s1'||k.link==='c_s2'||k.link==='c_s3'){const d=delta(k);if(d&&d.ch>num(S.th.emis))out.push({l:'m',m:f('al_up',{n:k.name,p:fmt(d.ch)})})}});
 const e=esrsStats();if(!e.t)out.push({l:'m',m:T('al_noesrs')});else if(e.n)out.push({l:'m',m:f('al_esrs',{n:e.n})});return out}

/* ============ CSV / files ============ */
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const first=t.split(/\r?\n/)[0]||'';const dl=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===dl){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
const toCSV=rows=>rows.map(r=>r.map(c=>{c=String(c??'');return/[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
function download(name,text,mime){const b=new Blob(['\uFEFF'+text],{type:mime||'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function pickFile(cb,accept){const i=document.createElement('input');i.type='file';i.accept=accept||'.csv,.txt';i.onchange=()=>{const fl=i.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>cb(String(r.result));r.onerror=()=>toast(T('import_bad'));r.readAsText(fl)};i.click()}

 box.innerHTML=`<h3>${esc(title)}</h3>${note?`<p class="sm muted">${esc(note)}</p>`:''}<form id="mf" novalidate>${fields.map(x=>fieldHtml(x,values[x.k])).join('')}<div class="mfoot">${onDelete?`<button type="button" class="btn danger" id="mdel">${esc(T('delete'))}</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" id="mcancel">${esc(T('cancel'))}</button><button class="btn primary">${esc(T('save'))}</button></div></form>`;
 m.hidden=false;$('#mcancel').onclick=closeModal;
 if(onDelete)$('#mdel').onclick=()=>{closeModal();onDelete()};
 $('#mf').onsubmit=e=>{e.preventDefault();const out={};for(const x of fields){if(x.t==='sec')continue;let v=e.target.elements[x.k].value;if(x.t==='number')v=num(v);else v=v.trim();if(x.req&&(v===''||v==null)){toast(T('invalid'));e.target.elements[x.k].focus();return}out[x.k]=v}if(onSave(out)!==false)closeModal()};
 const fi=$('#mf input:not([disabled]),#mf textarea');if(fi)fi.focus()}

A.setEdit=el=>{const n=el.dataset.set,cur=(D().sets[n]||{})[S.year]||[];openForm({title:T('edit_data')+' – '+T('set_'+n)+' '+S.year,fields:[{k:'txt',l:'set_hint',t:'textarea'}],values:{txt:cur.map(r=>r.l+','+r.v).join('\n')},onSave:v=>{const out=[];v.txt.split(/\n/).forEach(line=>{const i=line.lastIndexOf(',');if(i<1)return;const x=num(line.slice(i+1));if(x!=null)out.push({l:line.slice(0,i).trim(),v:x})});D().sets[n]=D().sets[n]||{};D().sets[n][S.year]=out;log('update','chart data '+n);save();render()}})};
/* overview lists */
A.hotAdd=()=>editList('hot','',T('add_hotspot'),[{k:'title',l:'title',req:1},{k:'text',l:'description',t:'textarea'},{k:'action',l:'action',t:'textarea'},{k:'owner',l:'owner'},{k:'lvl',l:'level',t:'select',o:LV()},{k:'due',l:'due'}],{lvl:'m'});
A.hotEdit=el=>editList('hot',el.dataset.id,T('hotspots'),[{k:'title',l:'title',req:1},{k:'text',l:'description',t:'textarea'},{k:'action',l:'action',t:'textarea'},{k:'owner',l:'owner'},{k:'lvl',l:'level',t:'select',o:LV()},{k:'due',l:'due'}]);
const cardF=[{k:'title',l:'title',req:1},{k:'value',l:'value'},{k:'text',l:'text',t:'textarea'},{k:'color',l:'color',t:'color'}];
A.cardAdd=()=>editList('cards','',T('add_card'),cardF,{color:'#00A86B'});A.cardEdit=el=>editList('cards',el.dataset.id,T('custom_cards'),cardF);
A.peerEdit=()=>openForm({title:T('peer_scores'),fields:['E','S','G'].map(p=>({k:p,l:'p_'+p,t:'number'})),values:D().peer,onSave:v=>{D().peer={E:v.E??'',S:v.S??'',G:v.G??''};log('update','peer scores');save();render()}});
/* ESRS */
const esrsF=()=>[{k:'ref',l:'ref',req:1},{k:'std',l:'standard',t:'select',o:S.standards.map(s=>[s.c,stdName(s.c)])},{k:'req',l:'requirement',t:'textarea',req:1},{k:'st',l:'status',t:'select',o:STO()},{k:'gap',l:'gap',t:'textarea'},{k:'action',l:'recommendation',t:'textarea'},{k:'ev',l:'evidence'}];
A.esrsAdd=()=>editList('esrs','',T('add_req'),esrsF(),{st:'n',std:S.standards[0]?S.standards[0].c:''});A.esrsEdit=el=>editList('esrs',el.dataset.id,T('esrs_title'),esrsF());
A.esrsExport=()=>{const rows=[['ref','standard','requirement','status','gap','recommendation','evidence']];D().esrs.forEach(r=>rows.push([r.ref,r.std,r.req,r.st,r.gap,r.action,r.ev]));download('esrs_assessment.csv',toCSV(rows));log('export','ESRS CSV')};
A.esrsTemplate=()=>download('esrs_template.csv',toCSV([['ref','standard','requirement','status(c/p/n)','gap','recommendation','evidence'],['E1-6','E1','Gross Scopes 1, 2, 3 and total GHG emissions','p','Scope 3 incomplete','Screen all categories','Carbon module']]));
A.esrsImport=()=>pickFile(t=>{try{const rows=parseCSV(t);let n=0;rows.slice(1).forEach(r=>{if(!r[0]||!r[2])return;const s=(r[3]||'').trim().toLowerCase();D().esrs.push({id:uid(),ref:r[0],std:r[1]||'',req:r[2],st:s[0]==='c'?'c':s[0]==='p'?'p':'n',gap:r[4]||'',action:r[5]||'',ev:r[6]||''});n++});log('import','ESRS CSV: '+n);save();render();toast(f('import_done',{n}))}catch(e){toast(T('import_bad'))}});
/* Carbon */
const actF=()=>[{k:'scope',l:'Scope',t:'select',o:[[1,T('sc1')],[2,T('sc2')],[3,T('sc3')]]},{k:'name',l:'activity',req:1},{k:'country',l:'country'},{k:'esrc',l:'energy_src'},{k:'qty',l:'qty',t:'number',req:1},{k:'unit',l:'unit',req:1,h:'formula'},{k:'lib',l:'pick_factor',t:'select',o:[['',T('none')],...D().factors.map(x=>[x.id,`${x.name} – ${x.value} /${x.fUnit}`])]},{k:'factor',l:'factor',t:'number',req:1},{k:'fUnit',l:'factor_unit'},{k:'source',l:'source'},{k:'fYear',l:'factor_year'}];
function actSaveFix(v){v.scope=+v.scope;if(v.lib){const x=D().factors.find(z=>z.id===v.lib);if(x){v.factor=x.value;v.fUnit=x.fUnit;v.source=x.source;v.fYear=x.year;if(!v.country)v.country=x.country}}delete v.lib;if(!v.fUnit)v.fUnit=v.unit;return v}
A.actAdd=()=>{const fs=actF();openForm({title:T('add_act'),fields:fs,values:{scope:1,fUnit:'',source:SRC,fYear:S.year},onSave:v=>{v=actSaveFix(v);D().acts.push({id:uid(),year:S.year,...v});log('calc','activity '+v.name);save();render()}})};
A.actEdit=el=>{const it=D().acts.find(a=>a.id===el.dataset.id);if(!it)return;openForm({title:it.name,fields:actF(),values:{...it,lib:''},onSave:v=>{Object.assign(it,actSaveFix(v));log('calc','activity '+it.name);save();render()},onDelete:()=>ask(T('confirm_delete'),()=>{D().acts=D().acts.filter(a=>a.id!==it.id);log('delete','activity '+it.name);save();render()})})};
A.actCopy=()=>{const p=D().acts.filter(a=>a.year===py(S.year));if(!p.length){toast(T('nothing'));return}ask(T('confirm_reset'),()=>{D().acts=D().acts.filter(a=>a.year!==S.year);p.forEach(a=>D().acts.push({...a,id:uid(),year:S.year}));log('calc','copied activities from '+py(S.year));save();render()})};
A.carbonCsv=A.actExport=()=>{const rows=[['year','scope','activity','country','energy_source','quantity','unit','factor_kgCO2e_per_unit','factor_unit','source','kgCO2e','tCO2e']];carbon(S.year).list.forEach(({a,t})=>rows.push([a.year,a.scope,a.name,a.country,a.esrc,a.qty,a.unit,a.factor,a.fUnit,a.source,(t*1000).toFixed(1),t.toFixed(3)]));download(`carbon_${S.year}.csv`,toCSV(rows));log('export','carbon CSV')};
A.actTemplate=()=>download('carbon_template.csv',toCSV([['scope','activity','quantity','unit','factor','factor_unit','source'],[2,'Electricity consumption',100000,'kWh',0.47,'kWh','Illustrative – verify']]));
A.actImport=()=>{toast(T('csv_cols_act'));pickFile(t=>{try{const rows=parseCSV(t);let n=0;rows.slice(1).forEach(r=>{const sc=parseInt(r[0]);if(![1,2,3].includes(sc)||!r[1])return;D().acts.push({id:uid(),year:S.year,scope:sc,name:r[1],country:'',esrc:'',qty:num(r[2])||0,unit:r[3]||'',factor:num(r[4])||0,fUnit:r[5]||r[3]||'',source:r[6]||SRC,fYear:S.year});n++});log('import','carbon CSV: '+n);save();render();toast(f('import_done',{n}))}catch(e){toast(T('import_bad'))}})};
const facF=[{k:'name',l:'name',req:1},{k:'value',l:'factor',t:'number',req:1},{k:'fUnit',l:'factor_unit',req:1},{k:'country',l:'country'},{k:'source',l:'source',req:1},{k:'year',l:'factor_year'}];
A.facAdd=()=>editList('factors','',T('add_factor'),facF,{source:SRC,year:S.year});A.facEdit=el=>editList('factors',el.dataset.id,T('factors_lib'),facF);
A.targetEdit=()=>openForm({title:T('targets'),fields:[{k:'base',l:'base_year',t:'select',o:S.years.map(y=>[y,y])},{k:'pct',l:'reduction_pct',t:'number'},{k:'tyear',l:'target_year'}],values:D().target,onSave:v=>{D().target={base:v.base,pct:v.pct??'',tyear:v.tyear};log('update','carbon target');save();render()}});
const recF=[{k:'title',l:'title',req:1},{k:'text',l:'text',t:'textarea'}];
A.recAdd=()=>editList('crecs','',T('add_rec'),recF);A.recEdit=el=>editList('crecs',el.dataset.id,T('crecs'),recF);
/* Materiality & benchmark */
const matF=()=>[{k:'n',l:'topic',req:1},{k:'p',l:'pillar',t:'select',o:PO()},{k:'impact',l:'impact',t:'number',req:1},{k:'fin',l:'financial',t:'number',req:1},{k:'note',l:'notes',t:'textarea'}];
const vOK=v=>{if(v.impact<0||v.impact>10||v.fin<0||v.fin>10){toast('0 – 10');return false}};
A.matAdd=()=>openForm({title:T('add_topic'),fields:matF(),values:{p:'E',impact:5,fin:5},onSave:v=>{if(vOK(v)===false)return false;D().mat.push({id:uid(),...v});log('add','topic '+v.n);save();render()}});
A.matEdit=el=>{const it=D().mat.find(x=>x.id===el.dataset.id);if(!it)return;openForm({title:it.n,fields:matF(),values:it,onSave:v=>{if(vOK(v)===false)return false;Object.assign(it,v);log('update','topic '+it.n);save();render()},onDelete:()=>ask(T('confirm_delete'),()=>{D().mat=D().mat.filter(x=>x.id!==it.id);log('delete','topic '+it.n);save();render()})})};
const benchF=()=>[{k:'n',l:'name',req:1},{k:'u',l:'unit'},{k:'kpi',l:'kpi_link',t:'select',o:[['',T('none')],...D().kpis.map(k=>[k.id,k.name])]},{k:'ours',l:'ours_value',t:'number'},{k:'peer',l:'peer_value',t:'number',req:1},{k:'hib',l:'higher_better',t:'select',o:YN()},{k:'note',l:'notes',t:'textarea'}];
A.benchAdd=()=>editList('bench','',T('add_bench'),benchF(),{hib:'y',kpi:''});A.benchEdit=el=>editList('bench',el.dataset.id,T('bench_title'),benchF());
A.benchNameEdit=()=>openForm({title:T('bench_name'),fields:[{k:'n',l:'bench_name',req:1}],values:{n:D().benchName},onSave:v=>{D().benchName=v.n;save();render()}});
/* Reports */
A.print=()=>{log('report','generated / printed');save();window.print()};
A.exportJson=()=>{download(`esg_${CO().name.replace(/\W+/g,'_')}_${S.year}.json`,JSON.stringify({exported:new Date().toISOString(),year:S.year,auditor:S.user,company:CO()},null,2),'application/json');log('export','JSON');save()};
const findF=()=>[{k:'title',l:'title',req:1},{k:'sev',l:'severity',t:'select',o:LV()},{k:'text',l:'text',t:'textarea'}];
A.findAdd=()=>editList('finds','',T('add_finding'),findF(),{sev:'m'});A.findEdit=el=>editList('finds',el.dataset.id,T('findings'),findF());
A.clearLog=()=>ask(T('confirm_delete'),()=>{S.log=[];save();render()});
/* Settings */
A.coAdd=()=>openForm({title:T('add_company'),fields:[{k:'name',l:'name',req:1},{k:'industry',l:'industry'},{k:'country',l:'country'}],onSave:v=>{const id='c'+uid();S.cos.push({id,...v,demo:false,d:emptyD()});S.cur=id;log('add','company '+v.name);save();render()}});
A.coEdit=el=>{const c=S.cos.find(x=>x.id===el.dataset.id);openForm({title:c.name,fields:[{k:'name',l:'name',req:1},{k:'industry',l:'industry'},{k:'country',l:'country'},{k:'demo',l:'demo_note',t:'select',o:[['n',T('no')],['y',T('yes')]]}],values:{...c,demo:c.demo?'y':'n'},onSave:v=>{Object.assign(c,{name:v.name,industry:v.industry,country:v.country,demo:v.demo==='y'});log('edit','company '+c.name);save();render()},onDelete:S.cos.length>1?()=>ask(T('confirm_delete'),()=>{S.cos=S.cos.filter(x=>x.id!==c.id);if(S.cur===c.id)S.cur=S.cos[0].id;log('delete','company '+c.name);save();render()}):null})};
A.colorsReset=()=>{S.colors=defaults().colors;save();render()};
A.stdAdd=()=>openForm({title:T('add_standard'),fields:[{k:'c',l:'code',req:1},{k:'n',l:'name',req:1}],onSave:v=>{S.standards.push(v);save();render()}});
A.stdEdit=el=>{const i=+el.dataset.i,s=S.standards[i];openForm({title:s.c,fields:[{k:'c',l:'code',req:1},{k:'n',l:'name',req:1}],values:s,onSave:v=>{S.standards[i]=v;save();render()},onDelete:()=>ask(T('confirm_delete'),()=>{S.standards.splice(i,1);save();render()})})};
A.labelsReset=()=>ask(T('confirm_delete'),()=>{S.labels[S.lang]={};save();render()});
A.backup=()=>download('esg-platform-backup.json',JSON.stringify(S),'application/json');
A.restore=()=>pickFile(t=>{try{const s=JSON.parse(t);if(!s||s.v!==2||!Array.isArray(s.cos))throw 0;S=merge(defaults(),s);save();render();toast(T('saved'))}catch(e){toast(T('import_bad'))}},'.json');
A.resetAll=()=>ask(T('confirm_reset'),()=>{localStorage.removeItem(KEY);S=defaults();save();render()});

/* ============ events ============ */
document.addEventListener('click',e=>{
 if(S.edit){const k=e.target.closest('[data-k]');if(k){e.preventDefault();e.stopPropagation();if(!k.isContentEditable){k.contentEditable='true';k.focus()}return}}
 const n=$('#notif');if(!n.hidden&&!e.target.closest('#notif')&&!e.target.closest('[data-a=notif]'))n.hidden=true;
 const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(fn){try{fn(el)}catch(err){console.error(err);toast('Error: '+err.message)}}},true);
document.addEventListener('focusout',e=>{const el=e.target;if(!(el.dataset&&el.dataset.k&&el.isContentEditable))return;el.contentEditable='false';const k=el.dataset.k,v=el.textContent.trim(),def=(I18N[S.lang]||{})[k]??I18N.en[k];S.labels[S.lang]=S.labels[S.lang]||{};if(v&&v!==def)S.labels[S.lang][k]=v;else{delete S.labels[S.lang][k];el.textContent=def}save();$$(`[data-k="${k}"]`).forEach(x=>{if(x!==el)x.textContent=T(k)})});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.sel==='cur'){S.cur=t.value;save();render()}
 else if(t.dataset.sel==='year'){S.year=t.value;save();render()}
 else if(t.dataset.f&&t.tagName==='SELECT'){F[t.dataset.f]=t.value;refreshF(t.dataset.f)}
 else if(t.dataset.act){const a=D().acts.find(x=>x.id===t.dataset.act),v=num(t.value);if(a&&v!=null){a[t.dataset.fld]=v;log('calc','activity '+a.name+' '+t.dataset.fld+'='+v);save();render()}}
 else if(t.dataset.m){const m=D().monthly[S.year]||(D().monthly[S.year]={em:Array(12).fill(''),en:Array(12).fill('')});m[t.dataset.m][+t.dataset.i]=t.value===''?'':num(t.value);log('update','monthly data');save();dMonthly()}
 else if(t.dataset.sec){S.sections[t.dataset.sec]=t.checked?1:0;save();$('#reportDoc').innerHTML=reportHTML()}
 else if(t.id==='yearsIn'){const ys=[...new Set(t.value.split(/[,\s]+/).filter(Boolean))].sort();if(ys.length){S.years=ys;if(!ys.includes(S.year))S.year=ys[ys.length-1];save();render()}}
 else if(t.dataset.col){S.colors[t.dataset.col]=t.value;save();applyTheme()}
 else if(t.dataset.pc){S.pillarColors[t.dataset.pc]=t.value;save()}
 else if(t.dataset.w){S.weights[t.dataset.w]=num(t.value)??0;save()}
 else if(t.dataset.th){S.th[t.dataset.th]=num(t.value)??0;save();if(S.page==='mat')render()}
 else if(t.dataset.lbl){const k=t.dataset.lbl;S.labels[S.lang]=S.labels[S.lang]||{};if(t.value.trim())S.labels[S.lang][k]=t.value.trim();else delete S.labels[S.lang][k];save();renderNav();renderTop()}
 else if(t.id==='auditNote'){D().note=t.value;log('update','auditor notes');save();$('#reportDoc').innerHTML=reportHTML()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&t.tagName==='INPUT'){F[t.dataset.f]=t.value;refreshF(t.dataset.f)}else if(t.id==='lblq'){$('#lblBody').innerHTML=labelRows()}});

/* ============ init ============ */
S=load();if(!S.cos.find(c=>c.id===S.cur))S.cur=S.cos[0].id;if(!S.years.includes(S.year))S.year=S.years[S.years.length-1];
render();
</script>
</body>
